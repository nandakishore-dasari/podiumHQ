apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: podiumhq
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/nandukrishnak/podiumhq.git
    targetRevision: HEAD
    path: helm/podiumhq
    helm:
      valueFiles:
        - values-prod.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: podiumhq
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ApplyOutOfSyncOnly=true
