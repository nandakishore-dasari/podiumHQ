# ==============================================================================
# PodiumHQ — Local Development Docker Compose Stack
# Architecture: Frontend (Nginx non-root) -> Backend (FastAPI non-root) -> PostgreSQL 16
# ==============================================================================

name: podiumhq

services:
  postgres:
    image: postgres:16-alpine
    container_name: podiumhq-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-podiumhq_db}
      POSTGRES_USER: ${POSTGRES_USER:-podium_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-podium_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-podium_user} -d ${POSTGRES_DB:-podiumhq_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - podiumhq-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: podiumhq-backend:local
    container_name: podiumhq-backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      PROJECT_NAME: ${PROJECT_NAME:-PodiumHQ}
      ENVIRONMENT: ${ENVIRONMENT:-development}
      APP_VERSION: ${APP_VERSION:-1.0.0}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-podium_user}:${POSTGRES_PASSWORD:-podium_password}@postgres:5432/${POSTGRES_DB:-podiumhq_db}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000,http://localhost:8080,http://podiumhq.local}
      RUN_MIGRATIONS: "true"
      SEED_DATABASE: "true"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - podiumhq-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: podiumhq-frontend:local
    container_name: podiumhq-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:8080"
    environment:
      BACKEND_HOST: backend
      BACKEND_PORT: 8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    networks:
      - podiumhq-network

volumes:
  postgres_data:
    driver: local

networks:
  podiumhq-network:
    driver: bridge
