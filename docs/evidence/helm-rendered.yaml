        runAsNonRoot: true
      containers:
        - name: frontend
          image: "ghcr.io/nandakishore-dasari/podiumhq-frontend:1.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsGroup: 101
