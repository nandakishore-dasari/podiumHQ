# Source: podiumhq/templates/backend-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: podiumhq-backend
  labels:
    app.kubernetes.io/name: podiumhq-backend
    app.kubernetes.io/component: backend
    helm.sh/chart: podiumhq-1.0.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: podiumhq
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: podiumhq-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podiumhq-backend
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: "ghcr.io/nandakishore-dasari/podiumhq-backend:1.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://podium_user:podium_secure_password_2026@podiumhq-postgres:5432/podiumhq_db"
            - name: RUN_MIGRATIONS
              value: "false"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
