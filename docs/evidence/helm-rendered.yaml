# Source: podiumhq/templates/hpa.yaml
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: podiumhq-backend-hpa
  labels:
    helm.sh/chart: podiumhq-1.0.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: podiumhq
spec:
  scaleTargetRef:
    apiVersion: apps/v1
