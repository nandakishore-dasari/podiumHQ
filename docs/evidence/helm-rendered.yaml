# Source: podiumhq/templates/postgres.yaml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: podiumhq-postgres
  labels:
    app.kubernetes.io/name: podiumhq-postgres
    app.kubernetes.io/component: database
    helm.sh/chart: podiumhq-1.0.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: podiumhq
spec:
  serviceName: podiumhq-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: podiumhq-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podiumhq-postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: "postgres:16-alpine"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "podiumhq_db"
            - name: POSTGRES_USER
              value: "podium_user"
            - name: POSTGRES_PASSWORD
              value: "podium_secure_password_2026"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "gp3"
        resources:
          requests:
            storage: "20Gi"
---
# Source: podiumhq/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: podiumhq
  labels:
    helm.sh/chart: podiumhq-1.0.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: podiumhq
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
spec:
  rules:
    - host: podiumhq.production.domain
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: podiumhq-backend
                port:
                  number: 8000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: podiumhq-backend
                port:
                  number: 8000
          - path: /ready
            pathType: Prefix
            backend:
              service:
                name: podiumhq-backend
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: podiumhq-frontend
                port:
                  number: 8080
---
# Source: podiumhq/templates/servicemonitor.yaml
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: podiumhq-backend
  labels:
    release: kube-prometheus-stack
    helm.sh/chart: podiumhq-1.0.0
    app.kubernetes.io/managed-by: Helm
