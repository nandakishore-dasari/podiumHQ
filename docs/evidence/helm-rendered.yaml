# Source: podiumhq/templates/migration-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: podiumhq-migration
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
  labels:
    app.kubernetes.io/name: podiumhq-migration
    helm.sh/chart: podiumhq-1.0.0
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/part-of: podiumhq
spec:
  template:
    metadata:
      labels:
        app.kubernetes.io/name: podiumhq-migration
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
      containers:
        - name: alembic-upgrade
          image: "ghcr.io/nandakishore-dasari/podiumhq-backend:1.0.0"
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: false
            runAsGroup: 10001
            runAsNonRoot: true
            runAsUser: 10001
          command: ["alembic", "upgrade", "head"]
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://podium_user:podium_secure_password_2026@podiumhq-postgres:5432/podiumhq_db"
