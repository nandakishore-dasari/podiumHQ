apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "podiumhq.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "podiumhq.name" . }}-backend
    app.kubernetes.io/component: backend
    {{- include "podiumhq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.backend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "podiumhq.name" . }}-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "podiumhq.name" . }}-backend
        app.kubernetes.io/component: backend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: backend
          image: "{{ .Values.backend.image.repository }}:{{ .Values.backend.image.tag }}"
          imagePullPolicy: {{ .Values.backend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.backend.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: DATABASE_URL
              value: "postgresql+psycopg://{{ .Values.postgres.credentials.user }}:{{ .Values.postgres.credentials.password }}@{{ include "podiumhq.fullname" . }}-postgres:5432/{{ .Values.postgres.credentials.database }}"
            - name: RUN_MIGRATIONS
              value: "false"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            {{- toYaml .Values.backend.resources | nindent 12 }}
