apiVersion: v1
kind: Service
metadata:
  name: {{ include "podiumhq.fullname" . }}-backend
  labels:
    app.kubernetes.io/name: {{ include "podiumhq.name" . }}-backend
    app.kubernetes.io/component: backend
    {{- include "podiumhq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8000
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "podiumhq.name" . }}-backend
