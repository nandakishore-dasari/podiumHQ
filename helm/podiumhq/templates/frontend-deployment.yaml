apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "podiumhq.fullname" . }}-frontend
  labels:
    app.kubernetes.io/name: {{ include "podiumhq.name" . }}-frontend
    app.kubernetes.io/component: frontend
    {{- include "podiumhq.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "podiumhq.name" . }}-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "podiumhq.name" . }}-frontend
        app.kubernetes.io/component: frontend
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: frontend
          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.frontend.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: BACKEND_HOST
              value: "{{ include "podiumhq.fullname" . }}-backend"
            - name: BACKEND_PORT
              value: "8000"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
