apiVersion: v1
kind: Service
metadata:
  name: {{ include "podiumhq.fullname" . }}-frontend
  labels:
    app.kubernetes.io/name: {{ include "podiumhq.name" . }}-frontend
    app.kubernetes.io/component: frontend
    {{- include "podiumhq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 8080
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app.kubernetes.io/name: {{ include "podiumhq.name" . }}-frontend
