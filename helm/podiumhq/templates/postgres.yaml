apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "podiumhq.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: {{ include "podiumhq.name" . }}-postgres
    app.kubernetes.io/component: database
    {{- include "podiumhq.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "podiumhq.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "podiumhq.name" . }}-postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "podiumhq.name" . }}-postgres
        app.kubernetes.io/component: database
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: "{{ .Values.postgres.credentials.database }}"
            - name: POSTGRES_USER
              value: "{{ .Values.postgres.credentials.user }}"
            - name: POSTGRES_PASSWORD
              value: "{{ .Values.postgres.credentials.password }}"
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: [ "ReadWriteOnce" ]
        storageClassName: "{{ .Values.postgres.persistence.storageClass }}"
        resources:
          requests:
            storage: "{{ .Values.postgres.persistence.size }}"
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "podiumhq.fullname" . }}-postgres
  labels:
    app.kubernetes.io/name: {{ include "podiumhq.name" . }}-postgres
    {{- include "podiumhq.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
  selector:
    app.kubernetes.io/name: {{ include "podiumhq.name" . }}-postgres
