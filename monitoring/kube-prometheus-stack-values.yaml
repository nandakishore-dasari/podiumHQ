# ==============================================================================
# kube-prometheus-stack Values for PodiumHQ
# ==============================================================================

prometheus:
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    retention: 7d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 20Gi

grafana:
  enabled: true
  adminPassword: "admin_secure_grafana_2026"
  sidecar:
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: "1"

alertmanager:
  enabled: true
