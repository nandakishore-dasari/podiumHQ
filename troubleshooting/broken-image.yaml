apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-image-demo
  namespace: podiumhq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-image
  template:
    metadata:
      labels:
        app: broken-image
    spec:
      containers:
        - name: backend
          image: ghcr.io/nandukrishnak/podiumhq-backend:nonexistent-tag-999
          ports:
            - containerPort: 8000
