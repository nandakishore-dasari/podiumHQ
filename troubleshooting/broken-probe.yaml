apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-probe-demo
  namespace: podiumhq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-probe
  template:
    metadata:
      labels:
        app: broken-probe
    spec:
      containers:
        - name: backend
          image: podiumhq-backend:local
          readinessProbe:
            httpGet:
              path: /nonexistent-probe-endpoint
              port: 8000
            initialDelaySeconds: 2
            periodSeconds: 2
