apiVersion: apps/v1
kind: Deployment
metadata:
  name: broken-secret-demo
  namespace: podiumhq
spec:
  replicas: 1
  selector:
    matchLabels:
      app: broken-secret
  template:
    metadata:
      labels:
        app: broken-secret
    spec:
      containers:
        - name: backend
          image: podiumhq-backend:local
          env:
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: non-existent-db-secret
                  key: password
